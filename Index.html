<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador de Intervalos</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
            --work-color: #4CAF50;
            --rest-color: #F44336;
            --primary-color: #2196F3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s;
        }

        .container {
            background-color: #1e1e1e;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            color: var(--primary-color);
        }

        .phase-text {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .timer-display {
            font-size: 5rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            margin: 20px 0;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            text-align: left;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #aaa;
        }

        input {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: white;
            padding: 8px;
            border-radius: 5px;
            font-size: 1rem;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
        }

        button:hover {
            opacity: 0.8;
        }

        #startBtn { background-color: var(--work-color); color: white; }
        #pauseBtn { background-color: #FF9800; color: white; }
        #resetBtn { background-color: #757575; color: white; }

        .work-mode { color: var(--work-color); }
        .rest-mode { color: var(--rest-color); }
    </style>
</head>
<body>

    <div class="container">
        <h1>Temporizador de Entrenamiento</h1>
        
        <div id="phaseText" class="phase-text work-mode">Preparado</div>
        <div id="timeDisplay" class="timer-display">00:00</div>

        <div class="settings-grid">
            <div class="setting-group">
                <label>Trabajo (Minutos)</label>
                <input type="number" id="workMin" value="1" min="0">
            </div>
            <div class="setting-group">
                <label>Trabajo (Segundos)</label>
                <input type="number" id="workSec" value="0" min="0" max="59">
            </div>
            <div class="setting-group">
                <label>Descanso (Minutos)</label>
                <input type="number" id="restMin" value="0" min="0">
            </div>
            <div class="setting-group">
                <label>Descanso (Segundos)</label>
                <input type="number" id="restSec" value="30" min="0" max="59">
            </div>
        </div>

        <div class="controls">
            <button id="startBtn">Iniciar</button>
            <button id="pauseBtn">Pausar</button>
            <button id="resetBtn">Reiniciar</button>
        </div>
    </div>

    <script>
        // Variables de estado
        let timerInterval;
        let isRunning = false;
        let isWorkPhase = true;
        let totalSeconds = 0;

        // Elementos del DOM
        const display = document.getElementById('timeDisplay');
        const phaseText = document.getElementById('phaseText');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Sintetizador de sonido (Campana)
        function playBell() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            // Frecuencia y tipo de onda (campana suave)
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime); // Nota A5
            
            // Efecto de desvanecimiento
            gain.gain.setValueAtTime(1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
            
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + 1.5);
        }

        function getSecondsFromInputs(prefix) {
            const min = parseInt(document.getElementById(`${prefix}Min`).value) || 0;
            const sec = parseInt(document.getElementById(`${prefix}Sec`).value) || 0;
            return (min * 60) + sec;
        }

        function updateDisplay() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            display.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        function switchPhase() {
            playBell();
            isWorkPhase = !isWorkPhase;
            
            if (isWorkPhase) {
                totalSeconds = getSecondsFromInputs('work');
                phaseText.textContent = "¡TRABAJO!";
                phaseText.className = "phase-text work-mode";
            } else {
                totalSeconds = getSecondsFromInputs('rest');
                phaseText.textContent = "DESCANSO";
                phaseText.className = "phase-text rest-mode";
            }
            updateDisplay();
        }

        function timerTick() {
            if (totalSeconds > 0) {
                totalSeconds--;
                updateDisplay();
            } else {
                switchPhase();
            }
        }

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                // Si el temporizador está en 0 (recién iniciado), tomar valores de los inputs
                if (totalSeconds === 0) {
                    isWorkPhase = true;
                    totalSeconds = getSecondsFromInputs('work');
                    phaseText.textContent = "¡TRABAJO!";
                    phaseText.className = "phase-text work-mode";
                    updateDisplay();
                    
                    // Pequeño pitido inicial para avisar que empezó
                    playBell();
                }
                
                isRunning = true;
                timerInterval = setInterval(timerTick, 1000);
            }
        });

        pauseBtn.addEventListener('click', () => {
            isRunning = false;
            clearInterval(timerInterval);
        });

        resetBtn.addEventListener('click', () =>
